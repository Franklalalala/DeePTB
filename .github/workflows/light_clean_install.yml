name: 0726-light clean install

on:
  push:
    branches: [0726-light]
  pull_request:

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install a known-compatible CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Install torch-scatter and DeePTB from a clean environment
        run: |
          python docs/auto_install_torch_scatter.py
          python -m pip install .
      - name: Smoke-test retained import and CLI surfaces
        run: |
          python -m dptb --help
          python - <<'PY'
          import dptb
          import dptb.nn.embedding
          import dptb.nnops.loss
          print(dptb.__version__)
          PY
      - name: Run lightweight installation-contract tests
        run: |
          python -m pip install pytest
          python -m pytest -q dptb/tests/test_light_install_contract.py
