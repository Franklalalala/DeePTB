[tool.poetry]
name = "dptb"
version = "2.0.1"
license = "LGPL-3.0"
description = "A unified deep learning package for electronic structure models including tight-binding, KS Hamiltonian and density matrix models"
readme = "README.md"
repository = "https://github.com/deepmodeling/DeePTB"

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
# Floor only: the wheel a user must install is platform/CUDA specific, so an
# upper bound here would fight the PyTorch index rather than protect anyone.
torch = ">=2.0"
numpy = "*"
scipy = "*"
matplotlib = "*"
ase = "*"
pyyaml = "*"
dargs = "0.4.4"
e3nn = ">=0.5.1"
torch-runstats = "0.2.0"
h5py = ">=3.7.0,<=3.11.0,!=3.10.0"
lmdb = "1.4.1"
tqdm = "*"
tensorboard = "*"
seekpath = "*"
torch-scatter = "2.1.2"
# dftio (ABACUS CSR export / hrebuild) is deliberately NOT declared: it has no
# PyPI release, so a requirement of any kind makes `pip install .` unresolvable
# for every user. It is imported lazily behind an actionable error instead --
# see DFTIO_MISSING_MESSAGE in dptb/postprocess/write_abacus_csr_file.py.
so2-cuda-ops = { git = "https://github.com/Franklalalala/SO2CUDA.git", branch = "main", optional = true }
openequivariance = { version = "0.6.8", python = ">=3.10", optional = true }
# Poetry groups are honoured only by `poetry install`; every documented install
# path uses pip, so the test requirements have to be a real extra.
pytest = { version = ">=7.2.0", optional = true }

[tool.poetry.extras]
so2 = ["so2-cuda-ops"]
openequi = ["openequivariance"]
test = ["pytest"]

[tool.poetry.scripts]
dptb = 'dptb.__main__:main'

[tool.pytest.ini_options]
# Six test modules import the repo-root `tools` package, which is not part of
# the wheel. Without this, the bare `pytest` console script cannot collect them
# from an installed-package checkout.
pythonpath = ["."]

[build-system]
requires = ["poetry-core", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"


[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
strict = false
format-jinja = """
    {%- if distance == 0 -%}
        {{ serialize_pep440(base, stage, revision) }}
    {%- elif revision is not none -%}
        {{ serialize_pep440(base, stage, revision + 1, dev=distance, metadata=[commit]) }}
    {%- else -%}
        {{ serialize_pep440(bump_version(base), stage, revision, dev=distance, metadata=[commit]) }}
    {%- endif -%}
"""
