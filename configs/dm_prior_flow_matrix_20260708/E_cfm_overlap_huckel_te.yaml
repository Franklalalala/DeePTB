# Group E: ordinary CFM with precomputed overlap-Huckel base plus typewise TE residual prior.
# node_h0/edge_h0 are used as the overlap-Huckel base storage convention; this
# is not a DFT H0 experiment.

data_options:
  train:
    root: /home/mingkang_nt/data/1118/cluster_1123_charge/updated_lmdb_overlap_huckel_haar_k8/train
    type: LMDBDataset
    prefix: data
    separator: "."
    get_DM: true
    get_overlap: true
    get_Hamiltonian: false
    get_H0: true
    prefer_precomputed_h0: true
  validation:
    root: /home/mingkang_nt/data/1118/cluster_1123_charge/updated_lmdb_overlap_huckel_haar_k8/valid
    type: LMDBDataset
    prefix: data
    separator: "."
    get_DM: true
    get_overlap: true
    get_Hamiltonian: false
    get_H0: true
    prefer_precomputed_h0: true

train_options:
  batch_size: 1
  val_batch_size: 1
  optimizer:
    type: AdamW
    lr: 0.01
    weight_decay: 0.01
    betas: [0.98, 0.999]
    eps: 1.0e-8
    amsgrad: false
  loss_options:
    train: &endpoint_report_loss
      method: hamil_abs
      z_loss_coef: 0
      onsite_shift: false
      onsite_boost: false
      debug_flag: false
    validation: *endpoint_report_loss
  flow_options:
    enabled: true
    objective: cfm
    mode: residual
    prior: te
    te_prior_mode: typewise
    te_prior_sigma: 0.25
    te_prior_per_graph: true
    missing_h0_policy: error
    node_target_key: node_features
    edge_target_key: edge_features
    node_h0_key: node_h0
    edge_h0_key: edge_h0
    overwrite_feature_keys: true
    detach_interpolated_h0: true
    loss_type: mse
    component_reduction: global_elements
    time_sampling: uniform
    t_min: 0.0
    t_max: 0.999
    t0_probability: 0.0
    endpoint_weight_power: 0.0
    endpoint_weight_cap: 100.0
    validation_ode_steps: [1]
    validation_flow_metrics: [random_t, one_step, trajectory]
