# A/B perf benchmark -- arm D: crystal with the OLD (N=1,3) validation cadence.
#
# Delta vs configs/h_b0_block_ode_crystal.yaml (new default): this arm restores
# the pre-change behavior explicitly, so the D comparison isolates the cost of
# the extra N=3 multi-step validation rollout plus the three validation logging
# probes.
#   * validation_ode_steps: [1, 3]  (new default is [1] -- endpoint-compatible only)
#   * log_validation_random_t_loss / log_validation_t0_loss /
#     log_validation_flow_euler_loss: true  (set explicitly here; these are the
#     argcheck defaults and are what the crystal yaml relied on implicitly before
#     the quiet flags were added to the default file).
# Everything else is byte-identical to configs/h_b0_block_ode_crystal.yaml.
common_options:
  basis: {C: 2s2p1d, Si: 3s3p2d}
  has_soc: false
  dtype: float32
  device: cpu

model_options:
  embedding:
    method: lem_moe_v3_h0
    output_route: h_b0
    use_h0_init: true
    use_h0_node_init: true
    use_h0_edge_init: true
    h0_merge_mode: replace
    use_flow_time_embedding: true
    flow_time_condition_edges: true
    flow_time_key: flow_time
    flow_time_allow_missing: false
    require_full_block_edge_coverage: true
  prediction:
    method: block_native
    block_decoder: expansion_cg
    blockwise_hamiltonian: true
    add_h0: false
    scale_type: no_scale

train_options:
  flow_options:
    enabled: true
    objective: cfm
    mode: residual
    prior: zero
    output_space: ao_block_ode
    block_ode: true
    target_semantics: residual_dh
    prediction_add_h0: false
    time_conditioning_required: true
    strict_h0: true
    block_inverse_mode: strict
    block_inverse_atol: 2.0e-5  # float32; fp64 certification uses 1.0e-10
    strict_certification: always  # opt-in example after offline audit: first_batch
    node_block_target_key: node_delta_hamil_blocks
    edge_block_target_key: edge_delta_hamil_blocks
    node_block_shape_key: node_delta_hamil_block_shape
    edge_block_shape_key: edge_delta_hamil_block_shape
    validation_ode_steps: [1, 3]  # arm D delta: OLD cadence (new default is [1])
    log_validation_random_t_loss: true   # arm D delta: OLD default (new default file sets false)
    log_validation_t0_loss: true         # arm D delta: OLD default (new default file sets false)
    log_validation_flow_euler_loss: true # arm D delta: OLD default (new default file sets false)

data_options:
  train: {type: LMDBDataset, get_Hamiltonian: true, get_H0: true, residual_hamiltonian: true, require_full_h_target: false, require_residual_h_target: true}
  validation: {type: LMDBDataset, get_Hamiltonian: true, get_H0: true, residual_hamiltonian: true, require_full_h_target: false, require_residual_h_target: true}
