name: Publish to TestPyPI

on:
  push:
    branches: [ dev ]

jobs:

  publish:
    # The so2 extra is a direct git URL, which TestPyPI rejects in uploaded
    # metadata. Only the upstream repository owns a releasable configuration;
    # forks must not attempt an upload.
    if: github.repository_owner == 'deepmodeling'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build package
      run: python -m build
        
    - name: Publish to TestPyPI
      env:
        TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload --verbose --repository-url https://test.pypi.org/legacy/ --password $TEST_PYPI_API_TOKEN dist/*


