# Overlay for the non-SOC H/O water direct-residual block-state ODE run (B arm).
# Consumes the SAME raw LMDB records as h_b0_block_ode_water.yaml (A arm) with no
# data remake: records still declare
#   hamiltonian_schema: deeptb.raw_hamiltonian_training_sample/v1
#   hamiltonian_target_semantics: absolute_full_h
#   hamiltonian_target_source: raw_hamiltonian
# The loader materializes residual endpoints D1 = raw hamiltonian - hamiltonian_0
# on the fly (residual_hamiltonian + require_residual_from_full_h_target).
common_options:
  basis: {H: 2s1p, O: 3s2p1d}
  has_soc: false
  dtype: float32
  device: cpu

model_options:
  embedding:
    method: lem_moe_v3_h0
    output_route: h_b0
    h0_init_scope: both
    h0_merge_mode: replace
    use_flow_time_embedding: true
    flow_time_condition_edges: true
    flow_time_key: flow_time
    flow_time_allow_missing: false
    require_full_block_edge_coverage: true
    use_spatial_residual_block_input: true
  prediction:
    method: block_native
    block_decoder: expansion_cg
    blockwise_hamiltonian: true
    reconstruction: direct
    scale_type: no_scale

train_options:
  flow_options:
    enabled: true
    objective: cfm
    mode: residual
    prior: zero
    output_space: residual_ao_block_ode
    block_ode: true
    state_space: residual_ao_block
    block_input_adapter: direct_cg
    h0_condition_space: spatial_h0_rme
    block_export_final_full_h: true
    target_semantics: residual_dh
    time_conditioning_required: true
    missing_h0_policy: error
    t0_probability: 0.15
    block_inverse_mode: strict
    block_inverse_atol: 2.0e-5  # float32; fp64 certification uses 1.0e-10
    strict_certification: always  # opt-in example after offline audit: first_batch
    node_block_target_key: node_delta_hamil_blocks
    edge_block_target_key: edge_delta_hamil_blocks
    node_block_shape_key: node_delta_hamil_block_shape
    edge_block_shape_key: edge_delta_hamil_block_shape
    validation_ode_steps: [1]
    validation_flow_metrics: []

data_options:
  train: {type: LMDBDataset, get_Hamiltonian: true, get_H0: true, residual_hamiltonian: true, require_full_h_target: false, require_residual_h_target: false, require_residual_from_full_h_target: true}
  validation: {type: LMDBDataset, get_Hamiltonian: true, get_H0: true, residual_hamiltonian: true, require_full_h_target: false, require_residual_h_target: false, require_residual_from_full_h_target: true}
