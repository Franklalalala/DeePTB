name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    # The so2 extra is a direct git URL, which PyPI rejects in uploaded
    # metadata. Only the upstream repository owns a releasable configuration;
    # forks must not attempt an upload.
    if: github.repository_owner == 'deepmodeling'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine keyrings.alt
    - name: Set PyPI API token
      env:
        PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        echo "TWINE_PASSWORD=${PYPI_API_TOKEN}" >> $GITHUB_ENV
    - name: Build package
      run: python -m build
    - name: Publish to PyPI
      run: |
        twine upload --verbose dist/*